name: GUI CI

on:
  push:
    paths:
      - "gui.py"
      - "gui_*.py"
      - "test/test_gui*.py"
      - "locales/*.json"
      - "requirements.txt"
      - ".github/workflows/gui-ci.yml"
  pull_request:
    paths:
      - "gui.py"
      - "gui_*.py"
      - "test/test_gui*.py"
      - "locales/*.json"
      - "requirements.txt"
      - ".github/workflows/gui-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run GUI unit tests
        run: |
          pytest -q test/test_gui.py test/test_gui_history.py test/test_gui_i18n.py test/test_gui_runtime.py
